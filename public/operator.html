<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMO Visionary Operator</title><style>:root{--bg:#08080a;--panel:#17171a;--soft:#222228;--line:#33333a;--text:#f5f5f7;--muted:#a1a1aa;--good:#10b981;--warn:#f59e0b;--bad:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{display:grid;grid-template-columns:245px minmax(520px,1fr) 390px;min-height:100vh}.side,.right{background:#101013;border-color:var(--line);height:100vh;overflow:auto;padding:18px}.side{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.main{height:100vh;overflow:auto;padding:24px 24px 160px}.brand{font-size:20px;font-weight:850}.muted{color:var(--muted);font-size:13px}.nav button,button,.pill{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:14px;padding:10px 12px}.nav button{display:block;width:100%;text-align:left;margin:7px 0}.nav button.active{background:#fff;color:#000}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.stat b{font-size:28px;display:block}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}textarea{width:100%;min-height:104px;background:transparent;color:#fff;border:0;outline:0;font:inherit;font-size:16px;resize:vertical}.composer{position:fixed;left:270px;right:410px;bottom:18px;background:#1d1d22;border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 20px 70px #000}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.evidence{font-size:12px;white-space:pre-wrap;color:#ddd;max-height:70vh;overflow:auto}.spinner{width:16px;height:16px;border:2px solid #555;border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{color:#9cc7ff}@media(max-width:1050px){.app{display:block}.side,.right,.main{height:auto}.composer{position:sticky;left:auto;right:auto}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="app"><aside class="side"><div class="brand">PMO Visionary</div><div class="muted">operator console</div><hr style="border-color:#333"><div class="nav"><button class="active" onclick="nav(event,'daily PMO brief')">Today</button><button onclick="nav(event,'show blockers and missing confirmations')">Risks / Blockers</button><button onclick="nav(event,'what source bridge links need review')">Source Bridge</button><button onclick="nav(event,'show upcoming RFS schedule')">Schedule</button><button onclick="nav(event,'draft a Patch tone owner update')">Draft</button><button onclick="location.href='/'">Advanced</button></div><div class="card"><b>Connection</b><p id="status" class="muted">Loading...</p></div></aside><main class="main"><h1 id="title">Today</h1><div id="summary" class="grid"></div><div id="answer" class="card">Ready.</div><div id="results"></div><div class="composer"><textarea id="q" placeholder="Ask naturally. Example: What needs my attention today? Which bridge links block mirror posting? Draft a Patch-tone response."></textarea><div class="row"><span id="working" class="muted">Clean UI. Evidence stays on the right.</span><button onclick="ask()">Run</button></div></div></main><aside class="right"><h2>Evidence</h2><p class="muted">IDs, boards, links, and diagnostics.</p><div id="evidence" class="evidence"></div></aside></div><script>const E=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={ok:false,error:t}}if(!r.ok||j.ok===false)throw new Error(j.error||r.statusText);return j}function busy(b){E('working').innerHTML=b?'<span class="spinner"></span> Working...':'Clean UI. Evidence stays on the right.'}function summary(d){E('summary').innerHTML=`<div class="card stat"><b>${d.counts.total}</b><span>Total</span></div><div class="card stat"><b>${d.counts.open}</b><span>Open</span></div><div class="card stat"><b class="good">${d.counts.ready}</b><span>Ready</span></div><div class="card stat"><b class="warn">${d.counts.blockers}</b><span>Needs review</span></div><div class="card stat"><b>${d.counts.bridgeReview}</b><span>Bridge review</span></div>`}function rows(arr=[]){E('results').innerHTML=arr.map(r=>`<div class="card"><div class="row"><b>${esc(r.name||r.canonicalId)}</b><span class="pill">${esc(r.status||r.confidence||'')}</span></div><p class="muted">${esc(r.board||r.boardId||'')} ${esc(r.itemId?'item '+r.itemId:'')} ${esc(r.owner?'owner '+r.owner:'')}</p>${r.url?`<a target="_blank" href="${esc(r.url)}">Open source</a>`:''}${r.d2d||r.tracker?`<p class="muted">D2D: ${esc(r.d2d?.itemId||'missing')} · Tracker: ${esc(r.tracker?.itemId||'missing')}</p>`:''}</div>`).join('')||'<div class="card muted">No records returned.</div>'}async function load(){try{let d=await api('/api/pmo/dashboard');summary(d);E('status').textContent=`${d.counts.total} records · bridge review ${d.counts.bridgeReview}`;E('answer').innerHTML='<b>Brief</b><p>'+esc(d.brief)+'</p>';rows(d.topBlockers);E('evidence').textContent=JSON.stringify(d,null,2)}catch(e){E('status').textContent=e.message;E('answer').innerHTML='<b class="bad">'+esc(e.message)+'</b>'}}async function ask(){busy(true);try{let q=E('q').value.trim()||'daily PMO brief';let r=await api('/api/pmo/ask',{method:'POST',body:JSON.stringify({query:q})});E('title').textContent=r.route.replaceAll('_',' ').toUpperCase();E('answer').innerHTML='<b>'+esc(r.route)+'</b><p>'+esc(r.answer).replace(/\n/g,'<br>')+'</p>';rows(r.evidence||[]);E('evidence').textContent=JSON.stringify(r,null,2)}catch(e){E('answer').innerHTML='<b class="bad">Failed</b><p>'+esc(e.message)+'</p>'}finally{busy(false)}}function nav(ev,q){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));ev.target.classList.add('active');E('q').value=q;ask()}E('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});load()</script></body></html>
